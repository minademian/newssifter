# Newssifter server blocks (production, Fedora).
#   Fedora:  /etc/nginx/conf.d/newssifter.conf
# Serves the chatbot SPA from the current release and proxies /api to the Node service
# (newssifter-api.service, 127.0.0.1:3000).
# Certificates come from certbot (webroot /var/www/certbot); see deploy/README.md for the first issuance.

# Port 80: ACME challenges and a redirect to HTTPS, nothing else.
server {
    listen 80;
    server_name apps.alpha.ursinenterprises.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name apps.alpha.ursinenterprises.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/apps.alpha.ursinenterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.alpha.ursinenterprises.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/newssifter/current/chatbot;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/xml text/css application/json;

    # Dotfiles do not exist as far as clients are concerned.
    location ~ /\. {
        return 404;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
