# Directories for Newssifter, created at boot and on demand.
#   install as /etc/tmpfiles.d/newssifter.conf, then: systemd-tmpfiles --create newssifter.conf
# Run systemd-sysusers first so the newssifter user exists.
#Type Path                         Mode  User   Group       Age
d     /etc/newssifter              0750  root   newssifter  -
d     /var/www/newssifter          0755  root   root        -
d     /var/www/newssifter/releases 0755  root   root        -
d     /var/www/certbot             0755  root   root        -
